l_english:
    ver_war.1.t:0 "The State of the State of Vermont"
    ver_war.1.d:0 "Vermont, in nothing short of a miracle, has found a way to survive nested between the Appalachian mountains. Originally poised to be the 14th state of the just-beginning Union, it is now left as the only succesor of a nation it was never a part of."
    ver_war.1.f:0 " #italic "Yet we owe no allegiance, we bow to no throne, \n Our ruler is law and the law is our own; \n Our leaders themselves are our own fellow-men, \n Who can handle the sword, or the scythe, or the pen... \n \n Come York or come Hampshire, come traitors or knaves,\n If ye rule o'er our land ye shall rule o'er our graves; \n Our vow is recorded–our banner unfurled...""
    ver_war.1.a:0 "" #italic ...In the name of Vermont, We defy all the world!""
    sotm:0 "#green #italic "The Song of the Vermonters" #!1779, John Greenleaf Whittier"
    uphill4vermont:0 "#italic Vermont faces an uphill battle to liberate an entire continent against the largest empire on the face of the Earth, but that all starts with freeing New England.\n #red [ROOT.GetCountry.GetFlagTextIcon] God help the Green Mountaineers [ROOT.GetCountry.GetFlagTextIcon]"
 #VERMONT War
     je_vermont_war_ver:0 "The Vermonter War" 
     je_vermont_war_ver_reason:0 "The Vermont Republic has defied Britain for nearly 60 years, but as Britain tightens its grip on the continent. Vermont will either free America or suffer its same fate. \n \n #b #L Successes and Failures in the Vermonter War: \n#!Phase 1:#! [ROOT.GetCountry.GetCustom('vermont_phase_1_result')] \n#b Phase 2:#! [ROOT.GetCountry.GetCustom('vermont_phase_2_result')] \n#b Phase 3:#! [ROOT.GetCountry.GetCustom('vermont_phase_3_result')]"
     je_negotiate_vermont_button:0 "Strike a deal for New England"
     je_negotiate_vermont_button_desc:0 "We have a very little shot. If we negotiate with the English they may look at us more favorably at negotiations."
     je_vermont_war_nen:0 "The Vermonter War" 
     je_vermont_war_nen_reason:0 "It's our job as the orignal (and greatest) New England colony to keep the rest in line, including Vermont. We must crush the pesky revolters. We must help our British overlords."
     
     loc_ver_phase1_ver: "#green New Hampshire has joined Vermont #!"
     loc_ver_phase1_nen: "#r Vermont lost control of the Yorker strip #!"
     loc_ver_phase1_und: "#lore As of now, only God knows. #!" 
     loc_ver_phase2_ver: "#green Maine is now Vermonter #!"
     loc_ver_phase2_nen: "#r Vermont is pushed back over the Connecticut #!"
     loc_ver_phase2_und: "#lore As of now, only God knows. #!" 
     loc_ver_phase3_ver: "#green #b We have Defied the World #! #!"
     loc_ver_phase3_nen: "#r Vermont shall never stand free again #!"
     loc_ver_phase3_hor: "[ROOT.GetCountry.GetFlagTextIcon] God help the Green Mountaineers! [ROOT.GetCountry.GetFlagTextIcon]"
     loc_ver_phase3_und: "#lore As of now, only God knows. #!" 